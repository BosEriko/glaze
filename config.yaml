rosewater: &rosewater "#f5e0dc"
flamingo: &flamingo "#f2cdcd"
pink: &pink "#f5c2e7"
mauve: &mauve "#cba6f7"
red: &red "#f38ba8"
maroon: &maroon "#eba0ac"
peach: &peach "#fab387"
yellow: &yellow "#f9e2af"
green: &green "#a6e3a1"
teal: &teal "#94e2d5"
sky: &sky "#89dceb"
sapphire: &sapphire "#74c7ec"
blue: &blue "#89b4fa"
lavender: &lavender "#b4befe"
gullgray: &gullgray "#a3a7bb"
text: &text "#cdd6f4"
subtext1: &subtext1 "#bac2de"
subtext0: &subtext0 "#a6adc8"
overlay2: &overlay2 "#9399b2"
overlay1: &overlay1 "#7f849c"
overlay0: &overlay0 "#6c7086"
surface2: &surface2 "#585b70"
surface1: &surface1 "#45475a"
surface0: &surface0 "#313244"
base: &base "#1e1e2e"
mantle: &mantle "#181825"
darkblue: &darkblue "#1b1e28"
crust: &crust "#11111b"

general:
  focus_follows_cursor: false
  cursor_follows_focus: false
  toggle_workspace_on_refocus: false
  show_floating_on_top: false
  floating_window_move_amount: "5%"
  center_new_floating_windows: true
  window_animations: "unchanged"

gaps:
  inner_gap: "10px"
  outer_gap: "10px"
focus_borders:
  active:
    enabled: true
    color: *sapphire
  inactive:
    enabled: false
    color: "#ff0000"

bar:
  height: "30px"
  position: "top"
  opacity: 1
  background: *darkblue
  foreground: *gullgray
  font_family: "JetbrainsMonoNL Nerd Font Mono"
  font_size: "12px"
  padding: "0px 5px"
  offset_x: "10px"
  offset_y: "10px"
  border_radius: "5px"
  components_left:
    - type: "workspaces"
      font_size: "20px"
      focused_workspace_background: "transparent"
      displayed_workspace_background: "transparent"
      default_workspace_background: "transparent"
      focused_workspace_foreground: *green
      default_workspace_foreground: *overlay0
  components_center:
    - type: "music"
      label_not_playing: ""
      label_paused: "󰏤 {song_title} - {artist_name}"
      label_playing: "▶ {song_title} - {artist_name}"
      max_title_length: 30
      max_artist_length: 20
      margin: "0 0 0 15px"
  components_right:
    - type: "binding mode"
      background: "#ffffff33"
      margin: "0 5px 0 5px"
      padding: "5px 8px"
    - type: "cpu"
      label: "⚙️ {percent_usage}%"
      refresh_interval_ms: 1000
      margin: "0 20px 0 0"
    - type: "memory"
      label: "🎟 {percent_usage}%"
      refresh_interval_ms: 1000
      margin: "0 20px 0 0"
    - type: "clock"
      time_formatting: "🕒 hh:mm tt  🗓️ ddd d/MM"
      margin: "0 10px 0 0"
    - type: "tiling direction"
      label_horizontal: "⮂ "
      label_vertical: "⮁ "
      background: "transparent"
      margin: "0 5px 0 10px"
    - type: "network"
      label_no_internet: "❎"
      label_ethernet: "✅"
      label_wifi_strength_0: "0️⃣"
      label_wifi_strength_25: "1️⃣"
      label_wifi_strength_50: "2️⃣"
      label_wifi_strength_75: "3️⃣"
      label_wifi_strength_100: "4️⃣"
      margin: "0 10px 0 0"

workspaces:
  - name: 1
    display_name: "󰖟"
    bind_to_monitor: 2
  - name: 2
    display_name: ""
    bind_to_monitor: 2
  - name: 3
    display_name: "󱂛"
    bind_to_monitor: 2
  - name: 4
    display_name: ""
    bind_to_monitor: 2
  - name: 5
    display_name: ""
    bind_to_monitor: 2
  - name: 6
    display_name: ""
    bind_to_monitor: 1
  - name: 7
    display_name: "󰭹"
    bind_to_monitor: 1
  - name: 8
    display_name: ""
    bind_to_monitor: 1
  - name: 9
    display_name: "󰏫"
    bind_to_monitor: 1
  - name: 0
    display_name: ""
    bind_to_monitor: 1

window_rules:
  - command: "ignore"
    match_process_name: "Taskmgr"
  - command: "set floating"
    match_class_name: "#32770"
  - command: "set floating"
    match_process_name: "StreamAvatars"
  - command: "set floating"
    match_process_name: "Warudo"
  - command: "set floating"
    match_process_name: "cs2"
  - command: "resize borders 0px -7px -7px -7px"
    match_process_name: "vivaldi"
  - command: "resize borders 0px -7px -7px -7px"
    match_process_name: "FortniteClient-Win64-Shipping"
  - command: "resize borders 0px -7px -7px -7px"
    match_process_name: "UnrealEditorFortnite-Win64-Shipping"
  - command: "resize borders 0px -7px -7px -7px"
    match_process_name: "EpicGamesLauncher"
  - command: "resize borders 0px -7px -7px -7px"
    match_process_name: "steamwebhelper"

keybindings:
  # Focus Windows
  - command: "focus left"
    bindings: ["LMenu+H"]
  - command: "focus right"
    bindings: ["LMenu+L"]
  - command: "focus up"
    bindings: ["LMenu+K"]
  - command: "focus down"
    bindings: ["LMenu+J"]

  # Focus Windows
  - command: "move left"
    bindings: ["LMenu+Shift+H"]
  - command: "move right"
    bindings: ["LMenu+Shift+L"]
  - command: "move up"
    bindings: ["LMenu+Shift+K"]
  - command: "move down"
    bindings: ["LMenu+Shift+J"]

  # Focus Workspace
  - command: "focus workspace 1"
    binding: "LMenu+1"
  - command: "focus workspace 2"
    binding: "LMenu+2"
  - command: "focus workspace 3"
    binding: "LMenu+3"
  - command: "focus workspace 4"
    binding: "LMenu+4"
  - command: "focus workspace 5"
    binding: "LMenu+5"
  - command: "focus workspace 6"
    binding: "LMenu+6"
  - command: "focus workspace 7"
    binding: "LMenu+7"
  - command: "focus workspace 8"
    binding: "LMenu+8"
  - command: "focus workspace 9"
    binding: "LMenu+9"
  - command: "focus workspace 0"
    binding: "LMenu+0"

  # Move Workspace
  - commands: ["move to workspace 1", "focus workspace 1"]
    binding: "LMenu+Shift+1"
  - commands: ["move to workspace 2", "focus workspace 2"]
    binding: "LMenu+Shift+2"
  - commands: ["move to workspace 3", "focus workspace 3"]
    binding: "LMenu+Shift+3"
  - commands: ["move to workspace 4", "focus workspace 4"]
    binding: "LMenu+Shift+4"
  - commands: ["move to workspace 5", "focus workspace 5"]
    binding: "LMenu+Shift+5"
  - commands: ["move to workspace 6", "focus workspace 6"]
    binding: "LMenu+Shift+6"
  - commands: ["move to workspace 7", "focus workspace 7"]
    binding: "LMenu+Shift+7"
  - commands: ["move to workspace 8", "focus workspace 8"]
    binding: "LMenu+Shift+8"
  - commands: ["move to workspace 9", "focus workspace 9"]
    binding: "LMenu+Shift+9"
  - commands: ["move to workspace 0", "focus workspace 0"]
    binding: "LMenu+Shift+0"

  # Open Applications
  - commands: ["focus workspace 2", "exec '%userprofile%/scoop/apps/youtube-music/current/YouTube Music.exe'"]
    binding: "RMenu+2"
  - commands: ["focus workspace 3", "exec '%userprofile%/scoop/apps/vscode/current/Code.exe'"]
    binding: "RMenu+3"
  - commands: ["focus workspace 7", "exec '%userprofile%/scoop/apps/chatty/current/Chatty.exe'"]
    binding: "RMenu+7"
  - commands: ["focus workspace 8", "exec vivaldi --new-window https://pass.proton.me/"]
    binding: "RMenu+8"
  - commands: ["focus workspace 9", "exec '%userprofile%/scoop/apps/notion/current/Notion.exe'"]
    binding: "RMenu+9"
  - commands: ["focus workspace 0", "exec '%userprofile%/scoop/apps/discord/current/discord-portable.exe'"]
    binding: "RMenu+0"
  
  # Resize Windows
  - command: "resize width -2%"
    binding: "LMenu+U"
  - command: "resize width +2%"
    binding: "LMenu+P"
  - command: "resize height +2%"
    binding: "LMenu+O"
  - command: "resize height -2%"
    binding: "LMenu+I"

  # Layout Orientation
  - command: "layout horizontal"
    binding: "LMenu+Oem5"
  - command: "layout vertical"
    binding: "LMenu+OemMinus"
    
  # Window Controls
  - command: "toggle focus mode"
    binding: "LMenu+Space"
  - command: "toggle floating"
    binding: "LMenu+Shift+Space"
  - command: "close"
    binding: "LMenu+Shift+Q"
    
  # Reload Config
  - command: "reload config"
    binding: "LMenu+Shift+R"
  
